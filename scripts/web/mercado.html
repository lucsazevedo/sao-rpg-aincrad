<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mercado — SAO RPG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase_config.js"></script>
<style>
  :root {
    --fundo: #0e0e12;
    --cartao: #181822;
    --borda: #2b2b3a;
    --texto: #e9e9f2;
    --muted: #8a8aa0;
    --destaque: #c9a14a;
    --perigo: #c04a4a;
    --ok: #5ab17c;
    --info: #6aa9ff;
    --incomum: #6fcf7a;
    --raro: #6aa9ff;
    --epico: #c485ff;
    --lendario: #ffb548;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fundo);
    color: var(--texto);
    font-family: Georgia, "Times New Roman", serif;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--borda);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    background: var(--fundo);
    z-index: 50;
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: 1px; }
  header .spacer { flex: 1; }
  .pill {
    display: inline-block;
    padding: 4px 10px;
    border: 1px solid var(--borda);
    border-radius: 999px;
    font-size: 13px;
    background: var(--cartao);
  }
  .pill.on { border-color: var(--destaque); color: var(--destaque); }
  .nav-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;
    padding: 4px 8px;
  }
  .nav-link:hover { color: var(--destaque); }
  .status-bar {
    display: flex;
    gap: 16px;
    padding: 10px 20px;
    background: var(--cartao);
    border-bottom: 1px solid var(--borda);
    flex-wrap: wrap;
    align-items: center;
    font-size: 14px;
  }
  .status-bar .campo { display: flex; align-items: center; gap: 6px; }
  .status-bar .val { color: var(--destaque); font-weight: bold; }

  .aviso-folego {
    padding: 8px 20px;
    background: linear-gradient(90deg, rgba(201,161,74,.12), rgba(201,161,74,.02));
    border-bottom: 1px solid rgba(201,161,74,.2);
    font-size: 13px;
    color: var(--muted);
    max-width: 1400px;
    margin: 0 auto;
    padding-left: 20px;
  }
  .aviso-folego b { color: var(--destaque); }

  /* abas */
  .tabs {
    max-width: 1400px;
    margin: 0 auto;
    padding: 12px 20px 0 20px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .tab {
    padding: 8px 16px;
    border: 1px solid var(--borda);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    background: var(--cartao);
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
  }
  .tab.on { color: var(--destaque); border-color: var(--destaque); background: var(--fundo); }

  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
  }

  .card {
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h2 {
    margin: 0 0 12px 0;
    font-size: 15px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--borda);
    padding-bottom: 6px;
  }

  .toolbar {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto;
    gap: 8px;
    margin-bottom: 16px;
  }
  @media (max-width: 860px) {
    .toolbar { grid-template-columns: 1fr 1fr; }
  }
  .toolbar input, .toolbar select {
    background: var(--fundo);
    border: 1px solid var(--borda);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--texto);
    font-family: inherit;
    font-size: 13px;
    width: 100%;
  }
  .toolbar button {
    background: var(--fundo);
    border: 1px solid var(--borda);
    color: var(--texto);
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  .toolbar button:hover { border-color: var(--destaque); color: var(--destaque); }

  .grid-anuncios {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .anuncio {
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: border-color .15s, transform .1s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .anuncio:hover { border-color: var(--destaque); transform: translateY(-2px); }
  .anuncio.vendido { opacity: .5; cursor: default; }
  .anuncio.vendido:hover { border-color: var(--borda); transform: none; }
  .anuncio .icone { font-size: 42px; text-align: center; line-height: 1; padding: 10px 0; }
  .anuncio .nome {
    font-size: 14px;
    font-weight: bold;
    text-align: center;
    min-height: 40px;
    line-height: 1.3;
  }
  .anuncio .tipo {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .anuncio .preco {
    text-align: center;
    color: var(--destaque);
    font-weight: bold;
    font-size: 18px;
    margin-top: 4px;
  }
  .anuncio .info {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    border-top: 1px dashed var(--borda);
    padding-top: 6px;
    margin-top: 2px;
  }
  .anuncio .info .vendedor {
    color: var(--info);
    cursor: pointer;
  }
  .anuncio .info .vendedor:hover { text-decoration: underline; }
  .anuncio .tempo {
    font-size: 10px;
    color: var(--muted);
    text-align: center;
  }
  .anuncio .tag {
    position: absolute;
    top: 6px;
    right: 6px;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--fundo);
    color: var(--muted);
    border: 1px solid var(--borda);
  }
  .rar-Comum    { background-image: linear-gradient(180deg, rgba(85,85,85,.12), transparent 40%); }
  .rar-Incomum  { background-image: linear-gradient(180deg, rgba(111,207,122,.14), transparent 40%); }
  .rar-Raro     { background-image: linear-gradient(180deg, rgba(106,169,255,.14), transparent 40%); }
  .rar-Épico    { background-image: linear-gradient(180deg, rgba(196,133,255,.18), transparent 40%); }
  .rar-Lendário { background-image: linear-gradient(180deg, rgba(255,181,72,.22), transparent 40%); }

  /* botoes gerais */
  .btn {
    padding: 7px 12px;
    background: var(--fundo);
    color: var(--texto);
    border: 1px solid var(--borda);
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
  }
  .btn:hover { border-color: var(--destaque); color: var(--destaque); }
  .btn.primario { background: var(--destaque); color: #1a1207; border-color: var(--destaque); }
  .btn.primario:hover { filter: brightness(1.1); color: #1a1207; }
  .btn.perigo { border-color: var(--perigo); color: var(--perigo); }
  .btn.ok { border-color: var(--ok); color: var(--ok); }

  /* modais */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal-bg.on { display: flex; }
  .modal {
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 8px;
    max-width: 520px;
    width: 100%;
    padding: 16px;
  }
  .modal h3 { margin: 0 0 8px 0; }
  .modal .info { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .modal .botoes { display: flex; gap: 8px; flex-wrap: wrap; }
  .modal .linha {
    display: flex; justify-content: space-between;
    padding: 6px 0; border-bottom: 1px dashed var(--borda);
    font-size: 13px;
  }
  .modal .linha:last-child { border-bottom: none; }

  .toast {
    position: fixed;
    bottom: 20px; right: 20px;
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-left: 3px solid var(--destaque);
    padding: 10px 14px;
    border-radius: 6px;
    z-index: 200;
    font-size: 14px;
    max-width: 360px;
    display: none;
  }
  .toast.erro { border-left-color: var(--perigo); }
  .toast.ok   { border-left-color: var(--ok); }
  .toast.on { display: block; }

  .login-card {
    max-width: 520px;
    margin: 40px auto;
    text-align: center;
    padding: 40px 24px;
  }
  .login-card p { color: var(--muted); }

  .vazio {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
    border: 1px dashed var(--borda);
    border-radius: 8px;
  }

  .minha-loja-actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }

  label.field {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  input.full {
    width: 100%;
    padding: 8px 10px;
    background: var(--fundo);
    border: 1px solid var(--borda);
    color: var(--texto);
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <h1>🏪 Mercado de Aincrad</h1>
  <a href="painel.html" class="nav-link">← Painel</a>
  <a href="inventario.html" class="nav-link">Inventário ←</a>
  <a href="personagens.html" class="nav-link">Fichas</a>
  <span class="spacer"></span>
  <div id="statusLogin"></div>
</header>

<div id="corpo"></div>

<div class="modal-bg" id="modalCompra">
  <div class="modal" id="modalCompraCont"></div>
</div>
<div class="modal-bg" id="modalDetalhe">
  <div class="modal" id="modalDetalheCont"></div>
</div>
<div class="toast" id="toast"></div>

<script src="modo_mestre.js"></script>
<script>
/* ======= Aplicação Mercado ======= */

var EU_PNOME = null;
var EU_PERS = null;
var ABA = "geral";        // geral | minha | loja
var VENDEDOR_FILTRO = null;  // quando clica num vendedor, filtra por ele
var ANUNCIOS = [];
var TIPO_ICONE = {
  arma: "🗡️", equipamento: "🛡️", consumivel: "🧪",
  material: "🪨", carta: "🃏", cristal: "💎", ovo: "🥚", pet: "🐾"
};
var _filtro = { busca: "", tipo: "", raridade: "", preco_min: "", preco_max: "" };

function toast(msg, tipo) {
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast " + (tipo || "");
  el.classList.add("on");
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.classList.remove("on"); }, 3200);
}

function corRar(r) {
  return ({
    "Comum": "#b9b9c8", "Incomum": "#6fcf7a", "Raro": "#6aa9ff",
    "Épico": "#c485ff", "Lendário": "#ffb548"
  })[r] || "#e9e9f2";
}
function fmtTempo(iso) {
  if (!iso) return "—";
  var t = new Date(iso).getTime() - Date.now();
  if (t <= 0) return "expirado";
  var d = Math.floor(t / 86400000); t -= d * 86400000;
  var h = Math.floor(t / 3600000);
  if (d > 0) return d + "d " + h + "h restantes";
  var m = Math.floor((t - h * 3600000) / 60000);
  if (h > 0) return h + "h " + m + "m restantes";
  return m + "min restantes";
}

async function main() {
  var sta = document.getElementById("statusLogin");
  await montarAreaJogador(sta);
  if (estaLogado()) {
    await carregarEu();
    if (EU_PERS) renderCabecalho();
  } else {
    EU_PNOME = null;
    EU_PERS = null;
  }
  renderAbas();
  renderLayout();
  // limpa expirados sempre que abrir a página
  try { await supaClient().rpc("limpar_anuncios_expirados"); } catch (e) { /* ignora */ }
  await carregarAnuncios();
  renderGrid();
}

async function carregarEu() {
  var eu = await supaClient().from("personagens")
    .select("*")
    .eq("dono_id", _sessao.user.id)
    .maybeSingle();
  if (eu.error) { toast(eu.error.message, "erro"); return; }
  EU_PERS = eu.data;
  if (EU_PERS) EU_PNOME = EU_PERS.nome;
}

function renderCabecalho() {
  var el = document.createElement("div");
  el.className = "status-bar";
  el.innerHTML =
    '<div class="campo">⚔️ Personagem: <span class="val">' + EU_PERS.nome + "</span></div>" +
    '<div class="campo">💰 Col na mão: <span class="val">' + (EU_PERS.col_mao || 0) + "</span></div>" +
    '<div class="campo">🏦 Col guardado: <span class="val">' + (EU_PERS.col_guardado || 0) + "</span></div>" +
    '<div class="campo">🌬️ Fôlego: <span class="val">' + (EU_PERS.folego || 0) + "/20</span></div>";
  document.getElementById("corpo").appendChild(el);

  var av = document.createElement("div");
  av.className = "aviso-folego";
  av.innerHTML = '⚡ <b>O Mercado NÃO gasta Fôlego!</b> Use quando quiser — mesmo sem energia para missões. Fôlego só é gasto em combate, coleta, ofício e crafting.';
  document.getElementById("corpo").appendChild(av);
}

function renderAbas() {
  var tabs = document.createElement("div");
  tabs.className = "tabs";
  tabs.innerHTML =
    '<button class="tab ' + (ABA === "geral" ? "on" : "") + '" data-tab="geral">🏠 Mercado Geral</button>' +
    (EU_PNOME
      ? '<button class="tab ' + (ABA === "minha" ? "on" : "") + '" data-tab="minha">🏪 Minha Loja</button>'
      : "") +
    (VENDEDOR_FILTRO
      ? '<button class="tab on" data-tab="loja" style="color:var(--info);">👤 Loja de ' + VENDEDOR_FILTRO + "</button>"
      : "");
  tabs.querySelectorAll("button.tab").forEach(function (b) {
    b.addEventListener("click", function () {
      var t = b.getAttribute("data-tab");
      if (t === "loja") return; // esse botão é só visual, o clique no nome do vendedor ativa
      ABA = t;
      VENDEDOR_FILTRO = null;
      document.querySelector(".tabs").remove();
      renderAbas();
      renderGrid();
    });
  });
  var corpo = document.getElementById("corpo");
  // insere depois do status-bar ou primeiro
  var primeiro = corpo.querySelector(".tabs");
  if (primeiro) primeiro.replaceWith(tabs);
  else corpo.appendChild(tabs);
}

function renderLayout() {
  var main = document.createElement("main");
  main.id = "main";
  // Filtros (só aba geral/loja tem; minha loja mostra meus anúncios)
  var html =
    '<div class="card" id="cardFiltro">' +
      "<h2>🔍 Filtros</h2>" +
      '<div class="toolbar">' +
        '<div><label class="field">Buscar</label><input id="fBusca" placeholder="Nome do item..." /></div>' +
        '<div><label class="field">Tipo</label>' +
          '<select id="fTipo">' +
            '<option value="">Todos</option>' +
            ['arma','equipamento','consumivel','material','carta','cristal','ovo','pet'].map(function(t){
              return '<option value="'+t+'">'+t.charAt(0).toUpperCase()+t.slice(1)+'</option>';
            }).join("") +
          '</select></div>' +
        '<div><label class="field">Raridade</label>' +
          '<select id="fRar">' +
            '<option value="">Todas</option>' +
            ['Comum','Incomum','Raro','Épico','Lendário'].map(function(r){return '<option value="'+r+'">'+r+'</option>';}).join("") +
          '</select></div>' +
        '<div><label class="field">Preço min</label><input id="fMin" type="number" min="0" placeholder="0" /></div>' +
        '<div><label class="field">Preço max</label><input id="fMax" type="number" min="0" placeholder="∞" /></div>' +
        '<div style="display:flex;align-items:flex-end;"><button id="fLimpar" class="btn">Limpar</button></div>' +
      "</div>" +
    "</div>" +
    '<div id="gridArea"></div>';
  main.innerHTML = html;
  document.getElementById("corpo").appendChild(main);

  // Binda filtros
  var b = document.getElementById("fBusca"); if (b) b.oninput = function(){_filtro.busca=b.value.trim().toLowerCase();renderGrid();};
  var t = document.getElementById("fTipo"); if (t) t.onchange = function(){_filtro.tipo=t.value;renderGrid();};
  var r = document.getElementById("fRar"); if (r) r.onchange = function(){_filtro.raridade=r.value;renderGrid();};
  var mn = document.getElementById("fMin"); if (mn) mn.oninput = function(){_filtro.preco_min=mn.value;renderGrid();};
  var mx = document.getElementById("fMax"); if (mx) mx.oninput = function(){_filtro.preco_max=mx.value;renderGrid();};
  var cl = document.getElementById("fLimpar"); if (cl) cl.onclick = function() {
    _filtro = { busca: "", tipo: "", raridade: "", preco_min: "", preco_max: "" };
    ["fBusca","fTipo","fRar","fMin","fMax"].forEach(function (id) {
      var e = document.getElementById(id); if (e) e.value = "";
    });
    renderGrid();
  };
}

async function carregarAnuncios() {
  var q = supaClient().from("vitrine")
    .select(`
      id, vendedor_nome, inventario_id, preco_col, criado_em, expira_em,
      vendido, comprador_nome, vendido_em,
      inventario ( id, tipo, item_id, nome, raridade, slot, quantidade, descricao, origem, obtido_em, excluido )
    `);
  var res = await q;
  if (res.error) { toast(res.error.message, "erro"); return; }
  ANUNCIOS = (res.data || []).filter(function (a) {
    return a.inventario && !a.inventario.excluido;
  });
}

function filtraAnuncios() {
  return ANUNCIOS.filter(function (a) {
    var inv = a.inventario || {};
    if (ABA === "minha") {
      if (a.vendedor_nome !== EU_PNOME) return false;
    } else {
      if (a.vendido) return false;
      if (new Date(a.expira_em).getTime() <= Date.now()) return false;
      if (VENDEDOR_FILTRO && a.vendedor_nome !== VENDEDOR_FILTRO) return false;
      if (_filtro.busca && inv.nome.toLowerCase().indexOf(_filtro.busca) === -1) return false;
      if (_filtro.tipo && inv.tipo !== _filtro.tipo) return false;
      if (_filtro.raridade && inv.raridade !== _filtro.raridade) return false;
      var mn = Number(_filtro.preco_min); if (!isNaN(mn) && mn > 0 && a.preco_col < mn) return false;
      var mx = Number(_filtro.preco_max); if (!isNaN(mx) && mx > 0 && a.preco_col > mx) return false;
    }
    return true;
  });
}

function renderGrid() {
  // esconde filtros se for minha loja
  var fc = document.getElementById("cardFiltro");
  if (fc) fc.style.display = (ABA === "minha") ? "none" : "block";

  var arr = filtraAnuncios();
  var area = document.getElementById("gridArea");
  if (!arr.length) {
    area.innerHTML = '<div class="vazio">📭 Sem anúncios por aqui.<br/>' +
      (ABA === "minha"
        ? 'Vá para o <a href="inventario.html" style="color:var(--destaque);">Inventário</a> e publique um item!'
        : (VENDEDOR_FILTRO ? "Essa loja não tem itens à venda no momento." : "Seja o primeiro a anunciar — use o Inventário!")) +
      "</div>";
    return;
  }
  if (ABA === "minha") {
    renderMinhaLoja(arr, area);
    return;
  }
  // Grid geral / loja vendedor
  var html = '<div class="grid-anuncios">' +
    arr.map(function (a) { return cardAnuncio(a); }).join("") +
    "</div>";
  area.innerHTML = html;
  bindCards();
}

function cardAnuncio(a) {
  var inv = a.inventario || {};
  var rar = inv.raridade || "Comum";
  var rarCls = "rar-" + rar.replace(/[^A-Za-zÉéíóúãõâêôçÇ]/g, '');
  var icone = TIPO_ICONE[inv.tipo] || "📦";
  var tag = a.vendido ? '<div class="tag" style="color:var(--ok);border-color:var(--ok);">VENDIDO</div>'
            : (new Date(a.expira_em).getTime() <= Date.now()
               ? '<div class="tag" style="color:var(--perigo);border-color:var(--perigo);">EXPIRADO</div>'
               : "");
  return (
    '<div class="anuncio ' + rarCls + (a.vendido ? " vendido" : "") + '" data-id="' + a.id + '">' +
      tag +
      '<div class="icone">' + icone + '</div>' +
      '<div class="nome" style="color:' + corRar(rar) + '">' + inv.nome + '</div>' +
      '<div class="tipo">' + (inv.tipo || "item") + (inv.slot ? " · " + inv.slot : "") + "</div>" +
      '<div class="preco">💰 ' + a.preco_col + " Col</div>" +
      '<div class="tempo">' + fmtTempo(a.expira_em) + "</div>" +
      '<div class="info">' +
        '<span>🏪 <span class="vendedor" data-vendedor="' + a.vendedor_nome + '">' + a.vendedor_nome + "</span></span>" +
        (inv.quantidade && inv.quantidade > 1 ? "<span>× " + inv.quantidade + "</span>" : "<span>#" + a.id + "</span>") +
      "</div>" +
    "</div>"
  );
}

function bindCards() {
  document.querySelectorAll("#gridArea .anuncio[data-id]").forEach(function (el) {
    if (el.classList.contains("vendido")) return;
    el.addEventListener("click", function (e) {
      // se clicou no nome do vendedor, troca aba
      var v = e.target.getAttribute && e.target.getAttribute("data-vendedor");
      if (v) {
        e.stopPropagation();
        VENDEDOR_FILTRO = v;
        ABA = "loja";
        var tabs = document.querySelector(".tabs");
        if (tabs) tabs.remove();
        renderAbas();
        renderGrid();
        return;
      }
      var id = Number(el.getAttribute("data-id"));
      var a = ANUNCIOS.find(function (x) { return x.id === id; });
      if (a) abrirCompra(a);
    });
  });
  document.querySelectorAll("#gridArea .vendedor[data-vendedor]").forEach(function (el) {
    el.addEventListener("click", function (e) {
      var v = el.getAttribute("data-vendedor");
      e.stopPropagation();
      VENDEDOR_FILTRO = v;
      ABA = "loja";
      var tabs = document.querySelector(".tabs");
      if (tabs) tabs.remove();
      renderAbas();
      renderGrid();
    });
  });
}

/* ----- Minha Loja ----- */
function renderMinhaLoja(arr, area) {
  // separa por status: ativos / vendidos / expirados
  var ativos = [], vendidos = [], expirados = [];
  arr.forEach(function (a) {
    if (a.vendido) vendidos.push(a);
    else if (new Date(a.expira_em).getTime() <= Date.now()) expirados.push(a);
    else ativos.push(a);
  });
  var estatisticas =
    '<div class="card"><h2>📊 Minha loja — estatísticas</h2>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;">' +
      '<div class="pill" style="padding:12px;">🏪 Anúncios ativos: <b style="color:var(--destaque);margin-left:6px;">' + ativos.length + "</b></div>" +
      '<div class="pill" style="padding:12px;">📦 Vendidos: <b style="color:var(--ok);margin-left:6px;">' + vendidos.length + "</b></div>" +
      '<div class="pill" style="padding:12px;">🕒 Expirados: <b style="color:var(--perigo);margin-left:6px;">' + expirados.length + "</b></div>" +
      '<div class="pill" style="padding:12px;">💸 Total recebido (100% valor, sem taxa): <b style="color:var(--destaque);margin-left:6px;">' +
        vendidos.reduce(function (s, a) { return s + a.preco_col; }, 0) + " Col</b></div>" +
    "</div></div>";

  function sessao(titulo, lista, cor) {
    if (!lista.length) return "";
    return '<div class="card"><h2 style="color:' + cor + ';">' + titulo + ' (' + lista.length + ')</h2>' +
      '<div class="grid-anuncios">' +
      lista.map(function (a) {
        var c = cardAnuncio(a);
        // injeta botões de ação no final
        var extra = '<div class="minha-loja-actions">';
        if (!a.vendido && new Date(a.expira_em).getTime() > Date.now()) {
          extra += '<button class="btn perigo" data-remove="' + a.id + '">❌ Remover anúncio</button>';
          extra += '<button class="btn" data-copiar="' + a.id + '">🔗 Copiar link</button>';
        }
        if (a.vendido) {
          extra += '<span style="color:var(--ok);font-size:12px;margin-left:auto;">✅ Vendido para ' +
            (a.comprador_nome || "—") + " em " + new Date(a.vendido_em).toLocaleDateString("pt-BR") + "</span>";
        }
        extra += "</div>";
        return c.replace("</div></div>", extra + "</div></div>");
      }).join("") +
      "</div></div>";
  }
  area.innerHTML = estatisticas +
    sessao("⭐ Ativos (à venda)", ativos, "var(--destaque)") +
    sessao("💰 Já vendidos", vendidos, "var(--ok)") +
    sessao("🕒 Expirados (item voltou pro inventário)", expirados, "var(--perigo)");

  area.querySelectorAll("button[data-remove]").forEach(function (b) {
    b.addEventListener("click", async function () {
      var id = Number(b.getAttribute("data-remove"));
      if (!confirm("Remover esse anúncio? O item volta automático pro inventário.")) return;
      var r = await supaClient().rpc("remover_anuncio", { p_vitrine_id: id });
      if (r.error) { toast(r.error.message || r.error, "erro"); return; }
      toast("✔️ Anúncio removido. Item voltou pro inventário!", "ok");
      await carregarAnuncios();
      renderGrid();
    });
  });
  area.querySelectorAll("button[data-copiar]").forEach(function (b) {
    b.addEventListener("click", function () {
      var id = b.getAttribute("data-copiar");
      var url = location.origin + location.pathname + "?anuncio=" + id;
      try { navigator.clipboard.writeText(url); toast("🔗 Link copiado!", "ok"); }
      catch (e) { prompt("Link do anúncio:", url); }
    });
  });
}

/* ----- Modal de Compra ----- */
function abrirCompra(a) {
  var inv = a.inventario || {};
  var rar = inv.raridade || "Comum";
  var modal = document.getElementById("modalCompra");
  var cnt = document.getElementById("modalCompraCont");
  cnt.innerHTML =
    '<h3 style="color:' + corRar(rar) + '">' + (TIPO_ICONE[inv.tipo] || "📦") + " " + inv.nome + "</h3>" +
    '<div class="info">Anúncio #' + a.id + " · Vendido por " +
      '<b style="color:var(--info);cursor:pointer;" id="irLojaVendedor">' + a.vendedor_nome + "</b>" +
      "</div>" +
    '<div style="margin-bottom:12px;">' +
      '<div class="linha"><span>Preço (você recebe 100% — sem taxa)</span><span style="color:var(--destaque);font-weight:bold;">💰 ' + a.preco_col + " Col</span></div>" +
      '<div class="linha"><span>Tipo</span><span>' + (inv.tipo || "—") + (inv.slot ? " · " + inv.slot : "") + "</span></div>" +
      '<div class="linha"><span>Raridade</span><span style="color:' + corRar(rar) + '">' + rar + "</span></div>" +
      '<div class="linha"><span>Quantidade</span><span>' + (inv.quantidade || 1) + "</span></div>" +
      '<div class="linha"><span>Expira em</span><span>' + fmtTempo(a.expira_em) + "</span></div>" +
    "</div>" +
    (inv.descricao ? '<div style="margin:10px 0;padding:10px;background:var(--fundo);border-radius:6px;border:1px solid var(--borda);">' + inv.descricao + "</div>" : "") +
    (EU_PERS
      ? '<div class="botoes">' +
          '<button class="btn primario" id="btnComprar">💸 Comprar agora</button>' +
          '<button class="btn" id="btnDetalhe">🔎 Ver detalhes do item</button>' +
          '<button class="btn" id="btnFecha">Fechar</button>' +
        "</div>"
      : '<div class="info" style="color:var(--perigo);">⚠️ Você precisa entrar com uma conta de jogador para comprar.</div>')
  ;
  modal.classList.add("on");
  modal.onclick = function (e) { if (e.target === modal) modal.classList.remove("on"); };
  document.getElementById("btnFecha").onclick = function () { modal.classList.remove("on"); };
  document.getElementById("irLojaVendedor").onclick = function () {
    modal.classList.remove("on");
    VENDEDOR_FILTRO = a.vendedor_nome;
    ABA = "loja";
    var t = document.querySelector(".tabs"); if (t) t.remove();
    renderAbas();
    renderGrid();
  };
  if (document.getElementById("btnDetalhe")) {
    document.getElementById("btnDetalhe").onclick = function () {
      abrirDetalhe(a);
    };
  }
  if (document.getElementById("btnComprar")) {
    document.getElementById("btnComprar").onclick = async function () {
      if (!confirm("Confirma a compra de " + inv.nome + " por " + a.preco_col + " Col?")) return;
      var r = await supaClient().rpc("comprar_da_vitrine", { p_vitrine_id: a.id });
      modal.classList.remove("on");
      if (r.error || (typeof r.data === "string" && r.data && r.data.length > 0)) {
        toast("❌ " + (r.error ? (r.error.message || r.error) : r.data), "erro");
        return;
      }
      toast("🎉 Compra concluída! Item foi adicionado ao seu inventário.", "ok");
      // atualiza estado
      await carregarEu();
      if (EU_PERS) {
        // atualiza barra de status
        var sb = document.querySelector(".status-bar");
        if (sb) sb.remove();
        renderCabecalho();
      }
      await carregarAnuncios();
      renderGrid();
    };
  }
}
function abrirDetalhe(a) {
  var inv = a.inventario || {};
  var rar = inv.raridade || "Comum";
  var md = document.getElementById("modalDetalhe");
  var cnt = document.getElementById("modalDetalheCont");
  cnt.innerHTML =
    '<h3 style="color:' + corRar(rar) + '">' + (TIPO_ICONE[inv.tipo] || "📦") + " " + inv.nome + "</h3>" +
    '<div class="info">' + inv.tipo + (inv.slot ? " · Slot: " + inv.slot : "") + ' · Raridade <b style="color:' + corRar(rar) + '">' + rar + "</b></div>" +
    (inv.descricao ? '<div style="margin:10px 0;line-height:1.5;">📝 ' + inv.descricao + "</div>" : "") +
    (inv.origem ? '<div class="info">Origem: ' + inv.origem + ' · Obtido em ' + new Date(inv.obtido_em).toLocaleDateString("pt-BR") + "</div>" : "") +
    '<div class="botoes"><button class="btn" onclick="document.getElementById(\'modalDetalhe\').classList.remove(\'on\')">Fechar</button></div>';
  md.classList.add("on");
  md.onclick = function (e) { if (e.target === md) md.classList.remove("on"); };
}

/* processa query params (ex: ?anuncio=123 ou ?vendedor=Fulano) */
(function () {
  var qp = new URLSearchParams(location.search);
  if (qp.get("vendedor")) { VENDEDOR_FILTRO = qp.get("vendedor"); ABA = "loja"; }
  if (qp.get("loja"))    { VENDEDOR_FILTRO = qp.get("loja");    ABA = "loja"; }
})();

main().catch(function (e) {
  console.error(e);
  toast(e.message || e, "erro");
});

/* se veio ?anuncio=ID, abre direto o modal depois de carregar */
async function abreAnuncioPorQuery() {
  var idq = new URLSearchParams(location.search).get("anuncio");
  if (!idq) return;
  await carregarAnuncios();
  var id = Number(idq);
  var a = ANUNCIOS.find(function (x) { return x.id === id; });
  if (a) setTimeout(function () { abrirCompra(a); }, 250);
}
setTimeout(abreAnuncioPorQuery, 1500);
</script>
